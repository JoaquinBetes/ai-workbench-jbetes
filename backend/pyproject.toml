[project]
name = "ai-workbench-backend"
version = "0.1.0"
description = "Backend de AI Workbench JBetes: API en FastAPI sobre Ollama"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "ollama>=0.6.1",
    "pydantic-settings>=2.4",
    "httpx>=0.27",
    "jsonschema>=4.20",
]

[dependency-groups]
dev = [
    "pytest>=8",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
